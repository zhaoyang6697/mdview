<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Markdown 预览</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <style>
    /* ===== 左右分栏布局 ===== */
    html, body { height: 100%; }
    #layout { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    #sidebar {
      width: 250px;
      min-width: 180px;
      border-right: 1px solid #e1e4e8;
      background: #f6f8fa;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid #e1e4e8;
    }
    #btn-open-folder {
      width: 100%;
      padding: 8px 10px;
      background: #2da44e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #btn-open-folder:hover { background: #2c974b; }
    #folder-path {
      margin-top: 8px;
      font-size: 11px;
      color: #57606a;
      word-break: break-all;
      max-height: 60px;
      overflow: hidden;
      line-height: 1.4;
    }
    #file-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .file-item {
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      color: #24292f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item:hover { background: #eaeef2; }
    .file-item.active { background: #ddf4ff; color: #0969da; }
    .empty-tip { padding: 14px 10px; font-size: 12px; color: #8b949e; text-align: center; }

    /* 右侧主区域:修复 100vh 导致的空滚动条 */
    #main-area {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }
    #main-area #placeholder { height: 100%; }
    #main-area #content.markdown-body { min-height: 0; }
  </style>
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="btn-open-folder">打开文件夹</button>
        <div id="folder-path">把文件夹或 .md 文件拖入窗口</div>
      </div>
      <div id="file-list"></div>
    </aside>
    <main id="main-area">
      <div id="toolbar">
        <button id="btn-set-default" title="把当前打开的文件设为默认 MD">设为默认 MD</button>
        <button id="btn-open-default" title="打开已设置的默认 MD 文件">打开默认 MD</button>
        <span id="status" class="status-text"></span>
      </div>
      <div id="placeholder">
        <h1>Markdown 预览</h1>
        <p>把文件夹或 .md 文件拖入此窗口</p>
      </div>
      <div id="content" class="markdown-body"></div>
      <div id="error" class="error-banner" style="display:none"></div>
    </main>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
