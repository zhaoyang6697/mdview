name: Build mdview (Windows)

on:
  workflow_dispatch: # 手动触发: Actions 页面点 "Run workflow" 可勾选是否打包安装程序
    inputs:
      build_installer:
        description: "同时打包 NSIS 安装程序(默认仅 exe,最快)"
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 编译 exe + WebView2Loader.dll
        working-directory: src-tauri
        run: cargo build --release

      - name: 安装 tauri-cli (快速二进制)
        shell: pwsh
        run: |
          iwr -useb https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1 | iex
          cargo binstall tauri-cli --no-confirm --version "2.*"

      - name: 打包 NSIS 安装程序 (可选)
        if: ${{ inputs.build_installer == 'true' }}
        working-directory: src-tauri
        run: cargo tauri build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mdview-windows
          path: |
            src-tauri/target/release/mdview.exe
            src-tauri/target/release/WebView2Loader.dll
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
